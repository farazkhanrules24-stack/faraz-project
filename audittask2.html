<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link rel="stylesheet" href="style.css">

</head>
<body>

  <div class="container">

    <!-- LEFT SIDE -->
    <div class="left">
<!-- left card 2 -->
      <div class="card charging">

        <div class="top">
          <span>⚡ Active charging</span>
          <span>19 min</span>
        </div>

        <div class="percent">
          <h1>75</h1>
          <span>/100</span>
        </div>

        <div class="progress">
          <div class="fill"></div>
        </div>

        <div class="bottom">
          <span>0%</span>
          <span>100%</span>
        </div>
    </div>

  <!-- left card 2 -->
    <div class="card range">
      <div class="rangeTop">
        <div>
          <p>Estimate</p>
          <p>range</p>
        </div>
        <h2>432 <span>mi</span></h2>
      </div>

      <img src="https://images.91wheels.com/assets/c_images/gallery/audi/sq8/audi-sq8-2-1778054289.png?w=850&q=40">

      <div class="footer">
        <span>⭯ Updated 2 days</span>
        <span>4924 mi.</span>
      </div>

    </div>
    </div>

    <!-- right phone -->

    <div class="phone">

      <div class="title">
        <h1>A6</h1>
        <p>e-tron</p>
      </div>

      <img src="audi-removebg-preview.png" class="front-car">

      <div class="controls">
        <div class="glass">
          <h3>📢</h3>
          <p>Honk</p>
        </div>

        <div class="glass">
          <h3>🛞</h3>
          <p>Summon</p>
        </div>
      </div>

      <div class="temp">
        <button>-</button>
        <div>
          <h2>72°</h2>
          <p>Temperature</p>
        </div>
        <button>+</button>
      </div>

      <button class="unlock">
        🔒 SWIPE TO UNLOCK
      </button>

      </div>
    </div>

</body>
</html>
